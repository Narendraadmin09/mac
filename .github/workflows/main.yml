name: macOS-Remote-Access
on: workflow_dispatch

jobs:
  secure-mac:
    runs-on: macos-latest
    timeout-minutes: 3600

    steps:
    - name: Configure Core Screen Sharing (VNC) Settings
      run: |
        # macOS Screen Sharing (VNC) ko background me enable karein
        sudo defaults write /var/db/launchd.db/com.apple.launchd/overrides.plist com.apple.screensharing -dict Disabled -bool false
        sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist
        
        # Firewall ko off karein taaki incoming connections block na ho
        sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off

    - name: Create Remote User
      run: |
        # Yahan apna manpasand Username aur Password set karein
        USER_NAME="myadmin"
        PASSWORD="MacPass@2026"
        
        # UniqueID ko 701 kiya hai taaki default user (501) se conflict na ho
        sudo dscl . -create /Users/$USER_NAME
        sudo dscl . -create /Users/$USER_NAME UserShell /bin/bash
        sudo dscl . -create /Users/$USER_NAME RealName "Mac User"
        sudo dscl . -create /Users/$USER_NAME UniqueID 701
        sudo dscl . -create /Users/$USER_NAME PrimaryGroupID 20
        sudo dscl . -create /Users/$USER_NAME NFSHomeDirectory /Users/$USER_NAME
        sudo dscl . -passwd /Users/$USER_NAME "$PASSWORD"
        sudo dscl . -append /Groups/admin GroupMembership $USER_NAME
        
        # Is user ke liye remote management access allow karein
        sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCAllowed 1
        
        echo "MAC_CREDS=User: $USER_NAME | Password: $PASSWORD" >> $GITHUB_ENV

    - name: Enable Screen Sharing Legacy VNC Settings
      run: |
        # Screen Sharing service ko active state me force karein
        sudo defaults write /Library/Preferences/com.apple.VNCSettings.txt ScreenSharingActive -bool true

    - name: Install Tailscale
      run: |
        # Homebrew ka use karke Tailscale jaldi se install karein
        brew install tailscale
        sudo brew services start tailscale

    - name: Establish Tailscale Connection
      env:
        TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      run: |
        # Tailscale ko auth key aur unique hostname ke sath up karein
        sudo tailscale up --authkey=$TAILSCALE_AUTH_KEY --hostname=gh-mac-runner-$GITHUB_RUN_ID
        
        # Tailscale assigned IP address ko fetch karein
        TS_IP=$(tailscale ip -4)
        if [ -z "$TS_IP" ]; then
          echo "Tailscale IP not assigned. Exiting."
          exit 1
        fi
        echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

    - name: Verify VNC Accessibility
      run: |
        echo "Tailscale IP: $TAILSCALE_IP"
        # Network utility se verify karein ki port 5900 open hai ya nahi
        nc -zv -w 5 $TAILSCALE_IP 5900

    - name: Maintain Connection
      run: |
        echo -e "\n=== macOS SCREEN SHARING ACCESS ==="
        echo "Address: $TAILSCALE_IP"
        echo "$MAC_CREDS"
        echo -e "===================================\n"
        
        # Runner session ko active rakhne ke liye infinite loop
        while true; do
          echo "[$(date)] macOS Remote Active - Cancel workflow to terminate"
          sleep 300
        done
