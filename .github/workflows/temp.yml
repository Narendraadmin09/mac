name: Windows RDP + Tailscale (Fully Static)

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          Write-Host "RDP enabled."

      - name: Create Static RDP User
        shell: powershell
        env:
          MY_SECRET_PASSWORD: \${{ secrets.RDP_PASSWORD }}
        run: |
          \$username = "github-admin"
          password = env:MY_SECRET_PASSWORD

          securePassword = ConvertTo-SecureString password -AsPlainText -Force

          if (Get-LocalUser -Name \$username -ErrorAction SilentlyContinue) {
              Remove-LocalUser -Name \$username
          }

          New-LocalUser `
            -Name $username `
            -Password \$securePassword `
            -FullName "Static RDP User" `
            -Description "GitHub Actions Permanent RDP User"

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member \$username

          # Admin privileges taaki aap software install kar sakein
          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member \$username

          Write-Host "Static RDP user created successfully."

      - name: Install Tailscale
        shell: powershell
        run: |
          installer = "env:TEMP\tailscale-setup.exe"

          Invoke-WebRequest `
            -Uri "https://tailscale.com" `
            -OutFile \$installer

          Start-Process `
            -FilePath $installer `
            -ArgumentList "/quiet" `
            -Wait

          Write-Host "Tailscale installed."

      - name: Connect to Tailscale (Static Identity)
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          # Hostname ko fix kiya taaki har baar same IP mile
          & $tailscale up `
            --authkey="\$env:TAILSCALE_AUTH_KEY" `
            --hostname="github-rdp-runner" `
            --accept-routes

          Write-Host "Connected to Tailscale with a fixed identity."

      - name: Get Static Tailscale IP
        shell: powershell
        run: |
          \$tailscale = "C:\Program Files\Tailscale\tailscale.exe"
          \(ip = &\)tailscale ip -4

          Write-Host ""
          Write-Host "======================================"
          Write-Host "RDP IS READY TO CONNECT"
          Write-Host "======================================"
          Write-Host "IP Address : \$ip"
          Write-Host "Username   : github-admin"
          Write-Host "Password   : [Aapka GitHub Secret Password]"
          Write-Host "======================================"
          Write-Host "Note: Ab aap har run me isi IP aur Password se bina logs dekhe connect kar sakte hain."
          Write-Host ""

      - name: Keep Runner Alive
        shell: powershell
        run: |
          Write-Host "Windows RDP is running..."
          while (\$true) {
              Start-Sleep -Seconds 60
          }
