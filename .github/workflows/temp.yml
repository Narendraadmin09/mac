name: Windows RDP + Tailscalee

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          Write-Host "RDP enabled."

      - name: Create RDP User
        shell: powershell
        env:
          RDP_USERNAME: YourCustomUsername
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $username = $env:RDP_USERNAME
          $password = $env:RDP_PASSWORD

          if ([string]::IsNullOrWhiteSpace($username) -or
              [string]::IsNullOrWhiteSpace($password)) {
            throw "Set RDP_USERNAME and RDP_PASSWORD before running."
          }

          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force

          $existingUser = Get-LocalUser -Name $username -ErrorAction SilentlyContinue

          if ($existingUser) {
            Remove-LocalUser -Name $username
          }

          New-LocalUser `
            -Name $username `
            -Password $securePassword `
            -FullName "RDP User" `
            -Description "GitHub Actions RDP User"

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username

          "RDP_USERNAME=$username" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "RDP user created successfully."

      - name: Install Tailscale
        shell: powershell
        run: |
          $installer = "$env:TEMP\tailscale-setup.exe"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" `
            -OutFile $installer

          Start-Process `
            -FilePath $installer `
            -ArgumentList "/quiet" `
            -Wait

          Write-Host "Tailscale installed."

      - name: Connect to Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          & $tailscale up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="github-rdp-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed."
          }

          Write-Host "Connected to Tailscale."

      - name: Get Tailscale IP
        shell: powershell
        run: |
          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"
          $ip = & $tailscale ip -4

          if ($LASTEXITCODE -ne 0 -or !$ip) {
            throw "Could not retrieve Tailscale IP."
          }

          Write-Host "======================================"
          Write-Host "RDP READY"
          Write-Host "======================================"
          Write-Host "Tailscale IP : $ip"
          Write-Host "RDP Port     : 3389"
          Write-Host "Username     : $env:RDP_USERNAME"
          Write-Host "Password     : Stored in GitHub Secrets"
          Write-Host "======================================"

      - name: Keep Runner Alive
        shell: powershell
        run: |
          Write-Host "Windows RDP is running."
          while ($true) {
            Start-Sleep -Seconds 60
          }
