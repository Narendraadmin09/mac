name: Windows RDP + Tailscale (High Performance)

on:
  workflow_dispatch:

jobs:
  rdp:
    # ⚠️ ध्यान दें: 16GB RAM और GPU के लिए आपको अपने organization के 
    # Large Runner का नाम यहाँ डालना होगा (उदा. windows-2022-gpu-8core)
    # अगर आपके पास Large Runner नहीं है, तो आपको Self-hosted runner सेटअप करना होगा।
    runs-on: windows-latest 
    timeout-minutes: 360

    steps:
      - name: Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService
          Write-Host "RDP enabled."

      - name: Create RDP User & Grant Admin Rights
        shell: powershell
        run: |
          \$username = "rdpuser"
          \(chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#\)%^&*"
          \$password = -join (1..20 | ForEach-Object { \(chars[(Get-Random -Maximum\)chars.Length)] })
          securePassword = ConvertTo-SecureString password -AsPlainText -Force
          
          if (Get-LocalUser -Name \$username -ErrorAction SilentlyContinue) {
              Remove-LocalUser -Name \$username
          }
          
          New-LocalUser -Name username -Password securePassword -FullName "RDP User" -Description "GitHub Actions RDP User"
          
          # GPU और भारी सॉफ्टवेयर इस्तेमाल करने के लिए Admin Rights जरूरी हैं
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member \$username
          Add-LocalGroupMember -Group "Administrators" -Member \$username
          
          "RDP_USERNAME=username" | Out-File -FilePath env:GITHUB_ENV -Append
          "RDP_PASSWORD=password" | Out-File -FilePath env:GITHUB_ENV -Append
          Write-Host "RDP user created with Admin privileges."

      - name: Install Nvidia GPU Drivers (Optional but Recommended)
        shell: powershell
        run: |
          Write-Host "Checking for GPU..."
          \$gpu = Get-CimInstance Win32_VideoController
          Write-Host "Detected GPU: (gpu.Name)"
          # यदि आपके रनर में Nvidia GPU है, तो आप Chocolatey के जरिए ड्राइवर इंस्टॉल कर सकते हैं:
          # choco install nvidia-display-driver -y

      - name: Install Tailscale
        shell: powershell
        run: |
          installer = "env:TEMP\tailscale-setup.exe"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile \$installer
          Start-Process -FilePath \$installer -ArgumentList "/quiet" -Wait
          Write-Host "Tailscale installed."

      - name: Connect to Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: \${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          \$tailscale = "C:\Program Files\Tailscale\tailscale.exe"
          # `--accept-routes` जोड़ा गया है बेहतर नेटवर्क कनेक्टिविटी के लिए
          & \$tailscale up --authkey="\(env:TAILSCALE_AUTH_KEY" --hostname="github-rdp-\)env:GITHUB_RUN_ID" --accept-routes
          Write-Host "Connected to Tailscale."

      - name: Get Tailscale IP & System Info
        shell: powershell
        run: |
          \$tailscale = "C:\Program Files\Tailscale\tailscale.exe"
          \$ip = & \(tailscale ip -4\)ram = (Get-CimInstance Win32_PhysicalMemory | Measure-Object -Property Capacity -Sum).Sum / 1GB
          \(totalRam = [Math]::Round((\)ram), 0)
          
          Write-Host ""
          Write-Host "======================================"
          Write-Host "RDP READY"
          Write-Host "======================================"
          Write-Host "Tailscale IP : \$ip"
          Write-Host "RDP Port     : 3389"
          Write-Host "Username     : \$env:RDP_USERNAME"
          Write-Host "Password     : \$env:RDP_PASSWORD"
          Write-Host "Total RAM    : \$totalRam GB"
          Write-Host "======================================"
          Write-Host ""

      - name: Keep Runner Alive
        shell: powershell
        run: |
          Write-Host "Windows RDP is running..."
          \$loopCount = 0
          while (\$true) {
              Start-Sleep -Seconds 60
              \$loopCount++
              # हर 10 मिनट में एक्टिविटी प्रिंट करेगा ताकि गिटहब को लगे रनर एक्टिव है
              if (\$loopCount -mod 10 -eq 0) {
                  Write-Host "Runner is still active and waiting..."
              }
          }
