name: macOS-JARVIS-Dual-Access
on: workflow_dispatch

jobs:
  secure-mac:
    runs-on: macos-latest
    timeout-minutes: 3600

    steps:
    - name: Configure SSH and OS Network Rules
      run: |
        # macOS Native SSH and Remote Management access override protocols
        sudo systemsetup -getremotelogin
        sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off

    - name: Create Remote User (No Home Dir)
      run: |
        USER_NAME="myadmin"
        PASSWORD="MacPass@2026"
        
        # Admin user accounts initialize protocol (UniqueID 701)
        sudo dscl . -create /Users/$USER_NAME
        sudo dscl . -create /Users/$USER_NAME UserShell /bin/bash
        sudo dscl . -create /Users/$USER_NAME RealName "Mac User"
        sudo dscl . -create /Users/$USER_NAME UniqueID 701
        sudo dscl . -create /Users/$USER_NAME PrimaryGroupID 20
        sudo dscl . -passwd /Users/$USER_NAME "$PASSWORD"
        sudo dscl . -append /Groups/admin GroupMembership $USER_NAME
        
        echo "MAC_CREDS=User: $USER_NAME | Password: $PASSWORD" >> $GITHUB_ENV

    - name: Setup Futuristic JARVIS Login Banner
      run: |
        # Base64 encrypted stream for smooth YAML code validation (No text-editor red lines)
        echo "ICAgICAg4pWMCuKWi║4pWMCuKWhuKWhuKWhuKWhuKWhuKWhuKWhuKWhuKWhuKWhuKWhuKWhuKWhuKWhuKWhuKWhuKWhuKWhuKWhuKWhuKWhuKWhuKWhuKWhuKWhuKWhuCgogW%" | base64 --decode | sudo tee /etc/motd

    - name: Clean Terminal Prompt Profile
      run: |
        echo 'export PS1="%n@JARVIS:%~ \$ "' | sudo tee -a /etc/bashrc /etc/zshrc

    - name: Force Enable Native macOS VNC (Screen Sharing)
      run: |
        # TigerVNC binary dependancy bypass karke system service load karein
        sudo defaults write /var/db/launchd.db/com.apple.launchd/overrides.plist com.apple.screensharing -dict Disabled -bool false
        sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist
        
        # Access parameters aur VNC configuration setup active state me layeind
        sudo defaults write /Library/Preferences/com.apple.VNCSettings.txt ScreenSharingActive -bool true
        sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCAllowed -bool true
        sudo defaults write /Library/Preferences/com.apple.RemoteManagement ARD_AllLocalUsers -bool true
        
        # Pure system core screen preferences authorization set karein
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
          -configure -allowAccessFor -allUsers -privs -all

    - name: Install Tailscale
      run: |
        brew install tailscale
        sudo brew services start tailscale

    - name: Establish Tailscale Connection
      env:
        TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      run: |
        sudo tailscale up --authkey=$TAILSCALE_AUTH_KEY --hostname=gh-mac-runner-$GITHUB_RUN_ID
        
        # Network identification update
        sudo scutil --set HostName "JARVIS"
        sudo scutil --set ComputerName "JARVIS"
        
        TS_IP=$(tailscale ip -4)
        if [ -z "$TS_IP" ]; then
          echo "Tailscale IP not assigned. Exiting."
          exit 1
        fi
        echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

    - name: Maintain Connection
      run: |
        echo -e "\n=== 🛠️ J.A.R.V.I.S DUAL ACCESS CHANNELS ACTIVE ==="
        echo "🖥️ HOST IP     : $TAILSCALE_IP"
        echo "👤 USERNAME    : myadmin"
        echo "🔑 PASSWORD    : MacPass@2026"
        echo -e "──────────────────────────────────────────────────"
        echo "📟 SSH COMMAND : ssh myadmin@$TAILSCALE_IP"
        echo "💻 VNC PORT    : 5900 (Native Screen Sharing Session)"
        echo -e "==================================================\n"
        
        while true; do
          echo "[$(date)] J.A.R.V.I.S Mainframe Online - Systems Stable."
          sleep 300
        done
